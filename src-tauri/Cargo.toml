[package]
name = "ager-designer"
version = "0.1.0"
description = "AGER Graph Designer — desktop shell for agent graph engineering"
authors = ["Spillwave"]
edition = "2021"

[lib]
name = "ager_designer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
